<div style="width:100%; max-width:1100px; margin:0 auto; overflow:hidden;">
 <iframe
 id="riuscitaFrame"
 src="https://felixfelicisharrypottergdr-jpg.github.io/riuscita/"
 style="
 display:block;
 width:100%;
 height:3600px;
 border:0;
 margin:0;
 padding:0;
 overflow:hidden;
 background:#f2e6c9;
 "
 scrolling="no"
 frameborder="0">
 </iframe>
</div>

<script type="text/javascript">
(function () {
    var frame = document.getElementById("riuscitaFrame");
    if (!frame) return;

    var ultimaSequenza = -1;

    window.addEventListener("message", function (event) {
        if (event.origin !== "https://felixfelicisharrypottergdr-jpg.github.io") {
            return;
        }

        if (event.source !== frame.contentWindow) {
            return;
        }

        if (!event.data || event.data.tipo !== "riuscita-height") {
            return;
        }

        var altezza = parseInt(event.data.height, 10);
        var sequenza = parseInt(event.data.seq, 10);

        if (!isNaN(sequenza) && sequenza < ultimaSequenza) {
            return;
        }

        if (!isNaN(sequenza)) {
            ultimaSequenza = sequenza;
        }

        if (!isNaN(altezza) && altezza >= 400 && altezza <= 50000) {
            frame.style.height = (altezza + 30) + "px";
        }
    });
})();
</script>
